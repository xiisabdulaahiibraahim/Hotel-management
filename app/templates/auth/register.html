<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Registration | The Grand Horizon Luxury Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0a0f1d 100%);
            padding: 2rem 1.5rem;
        }
        .register-card {
            width: 100%;
            max-width: 520px;
            padding: 2.5rem;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(217, 119, 6, 0.25);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="text-center mb-4">
            <div class="rounded-circle bg-gold d-inline-flex align-items-center justify-content-center mb-2" style="width: 50px; height: 50px;">
                <i class="fa-solid fa-hotel text-white fs-4"></i>
            </div>
            <h3 class="serif-gold fw-bold mb-1">THE GRAND HORIZON</h3>
            <p class="text-muted small">Guest Portal Account Registration</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} small py-2 d-flex align-items-center mb-3" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small text-muted">First Name</label>
                    <input type="text" name="first_name" class="form-control bg-dark text-light border-secondary" required placeholder="Enter first name">
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Last Name</label>
                    <input type="text" name="last_name" class="form-control bg-dark text-light border-secondary" required placeholder="Enter last name">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted">Username</label>
                <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required placeholder="Enter username">
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted">Email Address</label>
                <input type="email" name="email" class="form-control bg-dark text-light border-secondary" required placeholder="Enter email address">
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small text-muted">Phone Number</label>
                    <input type="text" name="phone" class="form-control bg-dark text-light border-secondary" placeholder="+252 61 ..." required>
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Passport / ID</label>
                    <input type="text" name="id_number" class="form-control bg-dark text-light border-secondary" placeholder="ID Number">
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-6">
                    <label class="form-label small text-muted">Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-gold w-100 py-2 fw-bold mb-3">
                Create Guest Account
            </button>

            <div class="text-center small text-muted">
                Already have an account? <a href="{{ url_for('auth.login') }}" class="text-gold text-decoration-none">Log In</a>
            </div>
        </form>
    </div>
</body>
</html>
