{% extends "base.html" %}

{% block title %}500 Server Error | The Grand Horizon HMS{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-warning serif-gold mb-2">500</div>
    <h3 class="fw-bold text-light mb-3">Internal Server Error</h3>
    <p class="text-muted small mb-4" style="max-width: 450px; margin: 0 auto;">
        An unexpected error occurred while processing your request. The engineering team has been notified.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-gold px-4">
        <i class="fa-solid fa-house me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
